name: Docs

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Cache .docz folder
        uses: actions/cache@v4
        with:
          path: ./.docz
          key: docz-${{ matrix.node }}-gatsby-v1-${{ github.run_id }}
          restore-keys: docz-${{ matrix.node }}-gatsby-v1-
      - name: Build
        run: yarn build
      - name: Build Docs
        run: yarn run docs-build
        # docz v2 / Gatsby v2 / webpack v4 is incompatible with the newer
        # ESM-first dependencies on the modernize branch. The docs build
        # passes on securitize/main but is expected to fail on modernize
        # until docz is replaced with a modern docs system.
        continue-on-error: ${{ github.head_ref == 'modernize' }}
