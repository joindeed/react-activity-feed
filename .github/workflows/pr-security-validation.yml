# PR Security Validation
# Gates: dependency install integrity + security regression tests.
# Full build/lint/snapshot coverage is handled by the repo's own workflows.

name: PR Security Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Dependency install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Verify clean install
        run: |
          if [ -f package.json ]; then
            if [ -f yarn.lock ]; then
              yarn install --ignore-scripts --frozen-lockfile
            else
              npm ci --ignore-scripts
            fi
          elif [ -f pom.xml ]; then
            mvn -B dependency:resolve -q
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            ./gradlew dependencies -q
          elif [ -f go.mod ]; then
            go mod download
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt --quiet
          elif [ -f pyproject.toml ]; then
            pip install -e . --quiet
          else
            echo "No recognized package manifest — skipping."
          fi

  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run security regression tests
        run: |
          if [ -f package.json ]; then
            if [ -f yarn.lock ]; then
              yarn install --ignore-scripts && yarn test -- test/security/ --no-coverage
            else
              npm install --ignore-scripts && npm test -- test/security/ --no-coverage
            fi
          elif [ -f pom.xml ]; then
            mvn -B test -Dtest="**/security/**"
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            ./gradlew test --tests "*.security.*"
          elif [ -f go.mod ]; then
            go test ./... -run Security -cover
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            pip install -e . --quiet && pytest tests/security/ --tb=short
          else
            echo "No recognized test runner — skipping."
          fi
